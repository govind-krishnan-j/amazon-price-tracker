{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><i class="ti ti-chart-line"></i></div>
        <p class="auth-title">Welcome back</p>
        <p class="auth-sub">Login to your Price Tracker account</p>
        <form method="POST">
            <div class="field">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="dark-input" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="dark-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:4px">Login</button>
        </form>
        <p class="auth-foot">
            Don't have an account? <a href="{{ url_for('register') }}" class="link">Register</a>
        </p>
    </div>
</div>
{% endblock %}
