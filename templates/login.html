{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
                <circle cx="7.5" cy="7.5" r="1.15" fill="currentColor" stroke="none"/>
                <path d="M13 9v5.2M10.7 12.2 13 14.5l2.3-2.3"/>
            </svg>
        </div>
        <p class="auth-title">Welcome back</p>
        <p class="auth-sub">Login to your Price Tracker account</p>
        <form method="POST">
            <div class="field">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="dark-input" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="dark-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:4px">Login</button>
        </form>
        <p class="auth-foot">
            Don't have an account? <a href="{{ url_for('register') }}" class="link">Register</a>
        </p>
    </div>
</div>
{% endblock %}
