{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><i class="ti ti-mail-check"></i></div>
        <p class="auth-title">Verify your email</p>
        <p class="auth-sub">We sent a 6-digit code to <span style="color:var(--accent-ink)">{{ email }}</span></p>

        <form method="POST">
            <div class="field">
                <label class="form-label">Enter OTP</label>
                <input type="text" name="otp" class="dark-input"
                       placeholder="••••••"
                       maxlength="6" required inputmode="numeric" autocomplete="one-time-code"
                       style="letter-spacing:0.5em;font-size:22px;text-align:center;font-weight:600">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">
                Verify email
            </button>
        </form>

        <div class="hint-box">
            <div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;font-weight:600">
                Didn't receive the code?
            </div>
            <div style="font-size:12.5px;color:var(--text-muted);line-height:1.9">
                • Check your spam / junk folder<br>
                • Make sure you entered the correct email<br>
                • <a href="{{ url_for('register') }}" class="link">Try registering again</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
