{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><i class="ti ti-user-plus"></i></div>
        <p class="auth-title">Create account</p>
        <p class="auth-sub">Start tracking prices in seconds</p>
        <form method="POST">
            <div class="field">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="dark-input" placeholder="Choose a username" required>
            </div>
            <div class="field">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="dark-input" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="dark-input" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;margin-top:4px">Create account</button>
        </form>
        <p class="auth-foot">
            Already have an account? <a href="{{ url_for('login') }}" class="link">Login</a>
        </p>
    </div>
</div>
{% endblock %}
